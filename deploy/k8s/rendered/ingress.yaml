---
# Source: flight-review/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flight-review
  namespace: flight-review
  labels:
    helm.sh/chart: flight-review-0.1.0
    app.kubernetes.io/name: flight-review
    app.kubernetes.io/instance: flight-review
    app.kubernetes.io/component: app
    app.kubernetes.io/version: "2026.10"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: flight-review
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  tls:
    - hosts:
        - "flight-review.example.mil"
      secretName: flight-review-tls
  rules:
    - host: "flight-review.example.mil"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: flight-review
                port:
                  name: http
