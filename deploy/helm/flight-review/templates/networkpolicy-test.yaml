{{- if and .Values.networkPolicy.enabled .Values.networkPolicy.allowHelmTest }}
# Egress for the `helm test` probe pod only: cluster DNS and the app Service
# port. Without this the namespace default-deny blocks the test.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "flight-review.fullname" . }}-test
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flight-review.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "flight-review.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: test
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              {{- include "flight-review.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 5006
{{- end }}
