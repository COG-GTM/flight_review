{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flight-review.configSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flight-review.labels" . | nindent 4 }}
type: Opaque
stringData:
  config_user.ini: |
    {{- include "flight-review.configIni" . | nindent 4 }}
  {{- if .Values.secrets.ulgePrivateKey }}
  private_key.pem: |
    {{- .Values.secrets.ulgePrivateKey | nindent 4 }}
  {{- end }}
{{- end }}
