apiVersion: v1
kind: Pod
metadata:
  name: {{ include "flight-review.fullname" . }}-test-connection
  namespace: {{ .Release.Namespace }}
  labels:
    helm.sh/chart: {{ include "flight-review.chart" . }}
    app.kubernetes.io/name: {{ include "flight-review.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: probe
      image: {{ include "flight-review.image" . | quote }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      command: ["python3", "-c"]
      args:
        - |
          import sys, urllib.request
          url = "http://{{ include "flight-review.fullname" . }}:{{ .Values.service.port }}/"
          body = urllib.request.urlopen(url, timeout=15).read().decode()
          sys.exit(0 if "Flight Review" in body else 1)
      resources:
        requests: {cpu: 50m, memory: 64Mi}
        limits: {cpu: 200m, memory: 128Mi}
